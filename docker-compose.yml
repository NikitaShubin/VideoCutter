# VideoCutter — автономное окружение (backend + ui).
# Workspace-ы: папки с видео + fragments.tsv на хосте в ./workspaces/.
# Запуск: docker compose up --build
# Файлы: положить .mp4 в ./workspaces/<имя_проекта>/ или загрузить через UI кнопкой «＋ Добавить видео».
services:
  videocutter_backend:
    container_name: videocutter_backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      VC_WORKSPACE_ROOT: /data/workspaces
      # Тюнинг префетча кадров (замерено матрицей 2026-09-22):
      # AHEAD=5 — быстрый разгон; IDLE=2.0 безопасен: аборт щадит задачи,
      # которых ждут (waiters), бросает только сиротский префетч.
      VC_PREFETCH_AHEAD: "5"
      VC_PREFETCH_IDLE_S: "2.0"
      # Железо (воркеры декода/префетча, размер GOP-кэша) — автотюн на старте
      # от ncpu/RAM (cgroup, иначе хост): эффективные значения — в логе
      # бэкенда и GET /api/v1/cache -> tuning. Явный VC_* бьёт автотюн:
      # VC_DECODE_CORES / VC_PREFETCH_WORKERS / VC_GOP_CACHE_MB / VC_GOP_CACHE_GOPS.
      # Приоритет экспорта: низкий (только свободные CPU).
      VC_EXPORT_NICE: "19"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
    volumes:
      - ./workspaces:/data/workspaces
    ports:
      - "${VC_BACKEND_PORT:-8001}:8001"

  videocutter_ui:
    container_name: videocutter_ui
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - videocutter_backend
    ports:
      - "${VC_UI_PORT:-3001}:80"
