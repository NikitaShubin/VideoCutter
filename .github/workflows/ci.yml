name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          # Версия, где импорт .ts (type-stripping) включён по умолчанию (>=23.6).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установить зависимости Python
        run: pip install -r backend/requirements.txt

      - name: Установить зависимости Node
        run: npm ci
        working-directory: frontend

      - name: Тесты ядра (JS-модель)
        run: node scripts/test_fragment_model.mjs

      - name: Тесты ядра (Python)
        run: python scripts/test_fragment_core.py

      - name: Сверка с легаси PyVideoCutter
        run: python scripts/compare_fragments.py --random 50

      - name: Django API-тесты
        working-directory: backend
        run: python manage.py test

      - name: Сборка фронтенда
        working-directory: frontend
        run: npm run build